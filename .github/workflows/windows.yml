name: Windows build and integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test installation discovery
        shell: powershell
        run: |
          .\tests\test-dev-environment.ps1
          .\tests\test-logged-process.ps1
          .\tests\test-python-discovery.ps1
      - name: Prepare tools and dictionaries
        shell: powershell
        run: .\scripts\setup.ps1
      - name: Shared developer command (no deployment)
        if: matrix.arch == 'x86'
        shell: cmd
        run: dev.cmd -BuildOnly
      - name: Build and run upstream tests
        if: matrix.arch == 'x64'
        shell: powershell
        run: .\build-rime-${{ matrix.arch }}.ps1
      - name: Run local AI integration tests
        if: matrix.arch == 'x64'
        shell: powershell
        run: .\.venv\Scripts\python.exe .\ai\tests\run_integration.py --arch ${{ matrix.arch }} --port 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.arch }}
          path: |
            ai/logs/integration-*.json
            librime/build-*/test/Testing/Temporary/LastTest.log
